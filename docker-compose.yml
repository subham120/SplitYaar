version: '3.8'

services:
  backend:
    build: ./backend
    container_name: splityaar-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://your_user:your_password@your_cluster.mongodb.net/splityaar?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-splityaar_docker_secret_change_me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30d}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: splityaar-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
